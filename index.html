<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!--CSS externo para los bordes porque los atributos antiguos (border, align, bgcolor) están obsoletos en HTML5 y separan el diseño del contenido-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table>
        <!-- caption sirve para poner un título o descripción visible a la tabla -->
        <caption>Horario de 1º DAW</caption>
        <!-- tr (table row): define cada una de las filas de la tabla -->
        <tr>
            <!-- th (table header): define celdas de encabezado (por defecto en negrita y centradas) -->
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>
        <!-- 1ª hora -->
        <tr>
            <th>1ª hora</th>
            <!-- td (table data): define celdas de datos normales dentro de una fila -->
            <!-- rowspan: atributo que permite a una celda expandirse verticalmente ocupando varias filas -->
            <td rowspan="2">Programación</td>
            <td rowspan="2">Sistemas informáticos</td>
            <td rowspan="2">Bases de datos</td>
            <td rowspan="2">Programación</td>
            <td>Sistemas informáticos</td>
        </tr>

        <!-- 2ª hora -->
        <tr>
            <th>2ª hora</th>
            <!-- Las celdas de Lunes a Jueves están ocupadas por el rowspan de la 1ª hora -->
            <td>Lenguajes de marcas</td>
        </tr>

        <!-- 3ª hora -->
        <tr>
            <th>3ª hora</th>
            <td>Entornos de desarrollo</td>
            <td>Programación</td>
            <td>Sistemas informáticos</td>
            <td>Bases de datos</td>
            <td>Programación</td>
        </tr>
                <!-- Recreo -->
        <tr>
            <th>Recreo</th>
            <!-- colspan: atributo que permite a una celda expandirse horizontalmente ocupando varias columnas -->
            <td colspan="5">Recreo</td>
        </tr>


    </table>
</body>
</html>
